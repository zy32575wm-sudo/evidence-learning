      const a = gNodes.find(n => n.id === e.from), b = gNodes.find(n => n.id === e.to);
      if (!a || !b) return "";
      return `<line class="rg-edge" data-from="${a.id}" data-to="${b.id}"
                x1="${a.x.toFixed(1)}" y1="${a.y.toFixed(1)}" x2="${b.x.toFixed(1)}" y2="${b.y.toFixed(1)}"
                stroke="${e.color}" stroke-width="${e.kind==='hier'?1.8:1.2}"
                ${e.kind==='skill' ? 'stroke-dasharray="4,4"' : ''} opacity="0.45" />`;
    }).join("");

    const svgNodesHtml = gNodes.map(n => {
      const hitSearch = !kw || n.label.toLowerCase().includes(kw);
      const isSel = selectedRoleItem && selectedRoleItem.id === n.id;
      const fillOp = n.type === "module" ? "0.18" : (n.type === "root" ? "0.08" : "0.14");
      const fontSize = n.type === "root" ? 13 : (n.type === "module" ? 12 : 11);
      const dispLbl = (n.type === "task" || n.type === "skill") && n.label.length > 8 ? n.label.slice(0, 8) + "…" : n.label;
      return `<g class="rg-node" data-id="${n.id}" style="cursor:pointer;opacity:${hitSearch ? 1 : 0.2}">
        <circle cx="${n.x.toFixed(1)}" cy="${n.y.toFixed(1)}" r="${isSel ? n.r + 4 : n.r}"
                fill="${n.color}" fill-opacity="${fillOp}" stroke="${n.color}" stroke-width="${isSel ? 3 : 1.8}" />
        <text x="${n.x.toFixed(1)}" y="${(n.y + (n.type==='root' || n.type==='module' ? 4 : n.r + 13)).toFixed(1)}"
              text-anchor="middle" font-size="${fontSize}" font-weight="${n.type==='skill'?500:700}"
              fill="var(--ink)">${esc(dispLbl)}</text>
      </g>`;
    }).join("");

    // Right drawer content
    let rightHtml = "";
    const sel = selectedRoleItem;
    if (sel.type === "task") {
      const t = sel.raw;
      rightHtml = `
        <div style="font-size:11px;color:var(--st-aipass);font-weight:700">● 具体岗位任务 · ${esc(t.modName)}</div>
        <h3 style="font-size:17px;margin:3px 0 4px">${esc(t.name)}</h3>
        <div style="font-size:12px;color:var(--ink-secondary)">出现频次：${esc(t.frequency || "常规")} ｜ 岗位权重：${t.weight ?? "-"} / 10</div>

          <h4>工作模式：一条标准动作链</h4>
          ${(t.chain || []).map((step, idx) => `<div class="chain-item"><span class="chain-num">0${idx+1}</span><span>${esc(step.replace(/^0\d\s*/, ""))}</span></div>`).join("")}
        </div>

        <div class="drawer-sec">
          <h4>输入 / 产出物（作品集验收锚点）</h4>
          <div class="io-grid">
            <div class="io-box"><div style="color:var(--ink-muted);font-size:11px">吃进什么（输入）</div><strong>${esc(t.input || "-")}</strong></div>
            <div class="io-box"><div style="color:var(--ink-muted);font-size:11px">吐出什么（产出）</div><strong>${esc(t.output || "-")}</strong></div>
          </div>
          <div style="font-size:12px;margin-top:6px"><strong>对接角色：</strong>${esc(t.collaborators || "独立完成")}</div>
          <div style="font-size:12px;margin-top:4px"><strong>常用工具：</strong>${esc((t.tools || []).join(" / ") || "-")}</div>
        </div>

        ${t.jd_quote ? `<div class="drawer-sec"><h4>招聘原文 / 验收依据</h4><p style="font-size:12px;color:var(--ink-secondary);font-style:italic">"${esc(t.jd_quote)}"</p></div>` : ""}

          </div>
        </div>
      `;
    } else if (sel.type === "skill") {
      const s = sel.raw;
      const stBadge = s.linked ? `<span class="badge ${ST_INFO[s.linked.status].badgeCls}">${ST_INFO[s.linked.status].label}</span>` : `<span class="badge b-todo">未建站</span>`;
      rightHtml = `
        <div style="display:flex;justify-content:space-between;align-items:center">

    const centerContent = roleSubMode === "graph" ? `
      <div class="canvas-shell" id="rg-shell">

            <strong>全景网状图</strong> <span style="color:var(--ink-secondary)">· 悬停任一节点高亮上下游链路，单击锁定右侧详情</span>
          </div>
          <div style="display:flex;gap:6px;pointer-events:auto">
            <input type="text" id="rg-search" value="${esc(roleSearch)}" placeholder="搜索任务 / 能力..." style="padding:4px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:12px;width:150px">
            <button class="btn-ghost" id="rg-to-list">切列表视图</button>

        <div class="canvas-viewport" id="rg-vp" style="width:820px;height:610px;transform:translate(${roleZoom.x}px,${roleZoom.y}px) scale(${roleZoom.scale})">
          <svg width="820" height="610">${svgEdgesHtml}${svgNodesHtml}</svg>
        </div>
        <div class="graph-tooltip" id="rg-tip"></div>
        <div class="canvas-legend">
          <span>━━ 职能包含关系</span>
          <span>┅┅ 能力调用关系</span>
          <span>● 内圈：职能域 ｜ 中圈：工作任务 ｜ 外圈：能力项</span>
        </div>

    ` : `
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
          <strong>岗位任务与产出物清单</strong>
          <button class="btn-ghost" id="rg-to-graph">切回全景网状图</button>
        </div>
        <table class="compact">
          <tr><th>模块</th><th>具体任务</th><th>吃进输入 → 吐出产出</th><th>需要能力</th></tr>
          ${mods.map((m, mi) => (m.tasks||[]).map((t, ti) => `<tr style="cursor:pointer" data-pick-task="task_${mi}_${ti}">
            <td>${esc(m.name)}</td>
            <td><strong>${esc(t.name)}</strong></td>
            <td>${esc(t.input)} → <strong>${esc(t.output)}</strong></td>
            <td>${esc((t.skills||[]).join("、"))}</td>
          </tr>`).join("")).join("")}
        </table>
      </div>
    `;

    el.innerHTML = `
      <div class="role-studio">
        <div class="card">
          <div style="font-size:11px;color:var(--ink-muted)">— 岗位名片</div>
          <h2 style="font-size:20px;margin:4px 0">${esc(rm.role_name)}</h2>
          <div style="font-size:12px;color:var(--ink-secondary);margin-bottom:10px">${esc(rm.industry_city_level || "")}</div>
          <p style="font-size:12px;padding-left:8px;border-left:2px solid var(--brand);margin-bottom:14px">${esc(rm.summary || "")}</p>

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px;padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)">
            <div><div style="color:var(--ink-muted)">图谱节点</div><strong>${gNodes.length}</strong></div>
            <div><div style="color:var(--ink-muted)">关联连线</div><strong>${gEdges.length}</strong></div>
            <div style="grid-column:span 2"><div style="color:var(--ink-muted)">数据性质（防伪造声明）</div><strong style="color:${rm.is_verified_sample?'var(--st-verif)':'var(--st-prac)'}">${esc(sampleNote)}</strong></div>
          </div>

          <div style="margin-top:12px">
            <div style="font-size:11px;color:var(--ink-muted);margin-bottom:4px">月度薪资三段参考</div>
            ${hasSal ? `<div style="display:flex;justify-content:space-between;font-size:12px;font-weight:700"><span>${sal.low}K</span><span>${sal.mid}K</span><span>${sal.high}K</span></div>
              <div style="height:5px;border-radius:3px;background:var(--st-prac-bg);margin:4px 0"><div style="width:65%;height:100%;background:var(--st-prac);border-radius:3px"></div></div>`
              : `<div style="font-size:12px;color:var(--ink-muted)">待采集真实招聘原文后自动生成</div>`}
          </div>

          <div style="margin-top:14px;padding-top:10px;border-top:1px solid var(--line)">
            <div style="font-size:11px;color:var(--ink-muted);margin-bottom:6px">三个新手优先入口任务</div>
            ${entryTasks.map((t, i) => `<div style="font-size:12px;margin-bottom:4px"><strong>0${i+1}</strong> ${esc(t.name)}</div>`).join("")}
          </div>
        </div>

        <div>${centerContent}</div>

        <aside class="drawer-card">${rightHtml}</aside>
      </div>
    `;

    // Interactions on Radial Graph
    const searchInput = document.getElementById("rg-search");
    if (searchInput) {
      searchInput.addEventListener("input", e => {
        roleSearch = e.target.value;
        renderRoleMap(curData());
        const ni = document.getElementById("rg-search");
        if (ni) { ni.focus(); ni.setSelectionRange(ni.value.length, ni.value.length); }
      });
    }
    const toListBtn = document.getElementById("rg-to-list");
    if (toListBtn) toListBtn.addEventListener("click", () => { roleSubMode = "list"; renderRoleMap(curData()); });
    const toGraphBtn = document.getElementById("rg-to-graph");
    if (toGraphBtn) toGraphBtn.addEventListener("click", () => { roleSubMode = "graph"; renderRoleMap(curData()); });

    el.querySelectorAll("[data-pick-task]").forEach(tr => tr.addEventListener("click", () => {
      const id = tr.dataset.pickTask;
      const found = gNodes.find(n => n.id === id);
      if (found) selectedRoleItem = found;
      renderRoleMap(curData());
    }));

    const tip = document.getElementById("rg-tip");
    el.querySelectorAll(".rg-node").forEach(gn => {
      gn.addEventListener("click", e => {
        e.stopPropagation();
        const found = gNodes.find(n => n.id === gn.dataset.id);
        if (found) { selectedRoleItem = found; renderRoleMap(curData()); }
      });
      gn.addEventListener("mouseenter", e => {
        const id = gn.dataset.id;
        const connected = new Set([id]);
        el.querySelectorAll(".rg-edge").forEach(ln => {
          const f = ln.dataset.from, t = ln.dataset.to;
          if (f === id || t === id) {
            connected.add(f); connected.add(t);
            ln.setAttribute("opacity", "1");
            ln.setAttribute("stroke-width", "2.8");
          } else {
            ln.setAttribute("opacity", "0.08");
          }
        });
        el.querySelectorAll(".rg-node").forEach(other => {
          other.style.opacity = connected.has(other.dataset.id) ? "1" : "0.18";
        });
        const nd = gNodes.find(n => n.id === id);
        if (tip && nd && nd.type === "task") {
          tip.innerHTML = `<strong>${esc(nd.label)}</strong><br><span style="color:var(--ink-secondary)">输入：${esc(nd.raw.input || "-")} → 产出：${esc(nd.raw.output || "-")}</span>`;
          tip.style.display = "block";
          tip.style.left = Math.min(540, nd.x + 18) + "px";
          tip.style.top = Math.max(48, nd.y - 12) + "px";
        }
      });
      gn.addEventListener("mouseleave", () => {
        el.querySelectorAll(".rg-edge").forEach(ln => {
          ln.setAttribute("opacity", "0.45");
          ln.setAttribute("stroke-width", "1.5");
        });
        el.querySelectorAll(".rg-node").forEach(other => { other.style.opacity = "1"; });
        if (tip) tip.style.display = "none";
      });
    });

    const rgShell = document.getElementById("rg-shell");
    const rgVp = document.getElementById("rg-vp");
    if (rgShell && rgVp) {
      let drag = false, sx = 0, sy = 0, ox = 0, oy = 0;
      const applyRg = () => { rgVp.style.transform = `translate(${roleZoom.x}px,${roleZoom.y}px) scale(${roleZoom.scale})`; };
      rgShell.addEventListener("mousedown", e => {
        if (e.target.closest(".rg-node") || e.target.closest("input") || e.target.closest("button")) return;
        drag = true; sx = e.clientX; sy = e.clientY; ox = roleZoom.x; oy = roleZoom.y;
      });
      window.addEventListener("mousemove", e => {
        if (!drag) return;
        roleZoom.x = ox + (e.clientX - sx); roleZoom.y = oy + (e.clientY - sy); applyRg();
      });
      window.addEventListener("mouseup", () => { drag = false; });
      rgShell.addEventListener("wheel", e => {
        e.preventDefault();
        roleZoom.scale = Math.min(1.6, Math.max(0.65, roleZoom.scale + (e.deltaY < 0 ? 0.08 : -0.08)));
        applyRg();
      }, { passive: false });
    }

    el.querySelectorAll("[data-goto-skill]").forEach(btn => btn.addEventListener("click", () => {
      const sk = btn.dataset.gotoSkill;
      const match = (M.nodes || []).find(n => n.name === sk || n.name.includes(sk) || sk.includes(n.name));
      if (match) {
        selectedNodeName = match.name;
        roadmapFilter = "all";
        switchView("roadmap");
        toast("已联动定位到学习节点：" + match.name);
      } else {
        copyText(`请把岗位任务所需能力「${sk}」加入我的阶段 1 学习计划与分级评价标准中。`, "该能力尚未建站，已复制补建指令");
      }
    }));
  }

  // ==================== VIEW 4: WEEKLY REVIEW & 4D SVG RADAR ====================
  function buildRadarSvg(dims) {
    const S = 260, C = 130, R = 86;
    const ptsFor = vals => vals.map((v, i) => {
      const ang = -Math.PI / 2 + (i * Math.PI) / 2;
      const r = (Math.max(0, Math.min(5, v)) / 5) * R;
      return `${(C + Math.cos(ang) * r).toFixed(1)},${(C + Math.sin(ang) * r).toFixed(1)}`;
    }).join(" ");

    const rings = [1, 2, 3, 4, 5].map(lv =>
      `<polygon points="${ptsFor([lv, lv, lv, lv])}" fill="none" stroke="var(--line)" stroke-width="1" />`
    ).join("");

    const axes = [0, 1, 2, 3].map(i => {
      const ang = -Math.PI / 2 + (i * Math.PI) / 2;
      const x = C + Math.cos(ang) * R, y = C + Math.sin(ang) * R;
      const lx = C + Math.cos(ang) * (R + 24), ly = C + Math.sin(ang) * (R + 18);
      const nm = dims[i] ? dims[i].name : "";
      return `<line x1="${C}" y1="${C}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--line)" />
              <text x="${lx.toFixed(1)}" y="${(ly + 4).toFixed(1)}" text-anchor="middle" font-size="12" fill="var(--ink-secondary)" font-weight="600">${esc(nm)}</text>`;
    }).join("");

    const curVals = [0, 1, 2, 3].map(i => (dims[i] && dims[i].score != null) ? dims[i].score : 2.0);
    const baseVals = curVals.map(v => Math.max(1, v - 0.8));

    return `<svg width="${S}" height="${S}" viewBox="0 0 ${S} ${S}" style="display:block;margin:0 auto">
      ${rings}${axes}
      <polygon points="${ptsFor(baseVals)}" fill="none" stroke="var(--ink-muted)" stroke-width="1.5" stroke-dasharray="4,4" />
      <polygon points="${ptsFor(curVals)}" fill="var(--brand)" fill-opacity="0.2" stroke="var(--brand)" stroke-width="2.4" />
    </svg>`;
  }

  function renderReview(M) {
    const el = document.getElementById("view-review");
    const c = countStatuses(M.nodes);
    const total = M.nodes.length || 1;
    const cal = M.calibration || {};

    const doneTxt = (M.recent_sessions && M.recent_sessions.length)
      ? M.recent_sessions.map(s => `${s.date}（${s.mins}分钟）：${s.done}`).join("；")
      : `已完成 ${M.total_attempts} 次实测记录，其中外部验证已掌握 ${c.verified} 站，练习通过待外部验证 ${c.ai_passed} 站。`;

    const stuckArr = [];
    if (M.due && M.due.length) stuckArr.push(`${M.due.length} 站到期需复习（${M.due.map(d => d.item).join("、")}）`);
    if (M.blindspots && M.blindspots.length) stuckArr.push(`高把握度答错盲区：${M.blindspots.join("、")}`);
    if (M.errors && M.errors.length) stuckArr.push(`头号错因：「${M.errors[0].reason}」（${M.errors[0].count} 次）`);
    const stuckTxt = stuckArr.length ? stuckArr.join("；") : "当前无逾期与高危盲区积压。";

    let nextAction = "挑 1 个主线未完成站点，走完「看示范 → 独立作答 → 报把握度测验 → 3 行总结」。";
    if (M.blindspots && M.blindspots.length) nextAction = `优先回到「${M.blindspots[0]}」重做变式盲测，消除"以为自己会了"的幻觉。`;
    else if (c.ai_passed > 0 && c.verified === 0) nextAction = `已有 ${c.ai_passed} 站通过 AI 练习：本周必须安排一次未见真题限时测或真实产出盲评，拿到第一份外部硬证据！`;

    el.innerHTML = `
      <div class="quote-hero" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
        <div>
          <h2>这一周，你走到哪了</h2>
          <p>数据全部来自你本机的实测记录，不美化进度，卡点与元认知高估如实标出。</p>
        </div>
        <button class="btn-ghost" id="rv-export-btn">↗ 导出学习档案 / 手机续接</button>
      </div>

      <div class="grid-4">
        <div class="card">
          <div style="font-size:12px;color:var(--ink-secondary)">连续活跃</div>
          <div class="ledger-num">${M.active_streak_days} <span style="font-size:13px;font-weight:400">天</span></div>
          <div style="font-size:11px;color:var(--ink-muted);margin-top:4px">累计学习 ${M.total_mins} 分钟</div>
        </div>
        <div class="card">
          <div style="font-size:12px;color:var(--ink-secondary)">外部硬证据完成率</div>
          <div class="ledger-num" style="color:var(--st-verif)">${Math.round((c.verified / total) * 100)}% <span style="font-size:13px;font-weight:400;color:var(--ink-secondary)">${c.verified}/${M.nodes.length} 站</span></div>
          <div style="font-size:11px;color:var(--st-aipass);margin-top:4px">另有 ${c.ai_passed} 站练习达标待外部验证</div>
        </div>
        <div class="card">
          <div style="font-size:12px;color:var(--ink-secondary)">元认知校准 Brier</div>
          <div class="ledger-num">${cal.brier != null ? cal.brier.toFixed(3) : "-"}</div>
          <div style="font-size:11px;color:var(--ink-muted);margin-top:4px">${cal.over_bias != null ? (cal.over_bias > 0 ? "平均高估 +" + Math.round(cal.over_bias * 100) + "%" : "平均偏差 " + Math.round(cal.over_bias * 100) + "%") : "0 最准，瞎猜 50% 得 0.25"}</div>
        </div>
        <div class="card">
          <div style="font-size:12px;color:var(--ink-secondary)">待复习与错题队列</div>
          <div class="ledger-num" style="color:var(--st-due)">${(M.due || []).length + (M.blindspots || []).length} <span style="font-size:13px;font-weight:400">项</span></div>
          <div style="font-size:11px;color:var(--ink-muted);margin-top:4px">高把握度答错盲区 ${(M.blindspots || []).length} 项</div>
        </div>
      </div>

      <div class="grid-2">
        <div class="card">
          <div class="sec-label"><span>能力四维雷达</span><span>实线：当前实测 vs 虚线：初始基线</span></div>
          ${buildRadarSvg(M.dims || [])}
          ${(cal.bins && cal.bins.length) ? `
            <div class="sec-label" style="margin-top:14px"><span>把握度校准表（防"以为自己会了"）</span></div>
            <table class="compact">
              <tr><th>作答前把握度</th><th>题数</th><th>实际正确率</th><th>高估/低估偏差</th></tr>
              ${cal.bins.map(b => `<tr>
                <td>${esc(b.label)}</td>
                <td>${b.count}</td>
                <td>${Math.round(b.acc * 100)}%</td>
                <td style="font-weight:700;color:${b.diff > 0.15 ? 'var(--st-due)' : 'inherit'}">${b.diff >= 0 ? '+' : ''}${Math.round(b.diff * 100)}%</td>
              </tr>`).join("")}
            </table>
          ` : ""}
        </div>

        <div class="card">
          <div class="sec-label"><span>每周三段式复盘（自动生成）</span><span>对齐止损线</span></div>
          <div style="border-left:3px solid var(--st-verif);padding-left:12px;margin-bottom:16px">
            <div style="font-size:12px;color:var(--ink-secondary)">1 · 这周实际完成了什么</div>
            <div style="font-size:13px;margin-top:3px">${esc(doneTxt)}</div>
          </div>
          <div style="border-left:3px solid var(--st-due);padding-left:12px;margin-bottom:16px">
            <div style="font-size:12px;color:var(--ink-secondary)">2 · 卡在哪里</div>
            <div style="font-size:13px;margin-top:3px">${esc(stuckTxt)}</div>
          </div>
          <div style="border-left:3px solid var(--cta);padding-left:12px;margin-bottom:16px">
            <div style="font-size:12px;color:var(--ink-secondary)">3 · 下周改哪一步</div>
            <div style="font-size:13px;font-weight:700;margin-top:3px">${esc(nextAction)}</div>
          </div>

          ${(M.rules && M.rules.length) ? `
            <div class="sec-label" style="margin-top:16px"><span>个人《学习说明书》已验证规则</span></div>
            <ul class="triage-list">${M.rules.map(r => `<li>📌 ${esc(r)}</li>`).join("")}</ul>
          ` : ""}
        </div>
      </div>
    `;

    document.getElementById("rv-export-btn").addEventListener("click", () => {
      document.getElementById("btn-open-sync").click();
    });
  }

  function renderAll() {
    const M = curData();
    document.getElementById("hdr-title").textContent = M.goal_name || "有据学习 · Evidence Learning";
    const sub = [M.stage, M.deadline ? ("截止 " + M.deadline) : "", "本地离线零水印"].filter(Boolean).join(" · ");
    document.getElementById("hdr-sub").textContent = sub;

    const demoBtn = document.getElementById("btn-toggle-demo");
    demoBtn.classList.toggle("demo-active", useDemo);
    demoBtn.textContent = useDemo ? "当前：样例演示（点此切真实库）" : "切换样例演示";

    const bannerSlot = document.getElementById("demo-banner-slot");
    if (useDemo) {
      bannerSlot.innerHTML = `<div class="demo-banner">
        <span>👀 <strong>当前正在预览内置交互样例（「短视频剪辑师转岗」完整演示集）</strong>——所有路线节点、任务链网状图与闯关台均可直接点击体验，不会污染你的个人真实数据。</span>
        ${!vaultIsEmpty ? `<button class="btn-ghost" id="banner-exit-demo">切回我的真实学习库</button>` : ""}
      </div>`;
      const exBtn = document.getElementById("banner-exit-demo");
      if (exBtn) exBtn.addEventListener("click", () => { useDemo = false; renderAll(); });
    } else {
      bannerSlot.innerHTML = "";
    }

    if (activeView === "overview") renderOverview(M);
    else if (activeView === "roadmap") renderRoadmap(M);
    else if (activeView === "classroom") renderClassroom(M);
    else if (activeView === "rolemap") renderRoleMap(M);
    else if (activeView === "review") renderReview(M);
  }

  renderAll();
})();
</script>
</body>
</html>
